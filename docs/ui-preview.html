<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindmesh, Aura UI preview</title>
<style>
/* ===== Aura design system: same tokens and classes as web/src/app/globals.css ===== */
:root {
  color-scheme: light;
  --ink: #1D2321; --ink-2: #56605B; --ink-3: #8A948F;
  --orange: #F2621A; --orange-press: #D9540F;
  --mint: #D3EADC; --sky: #D2E5EE; --peach: #F7CDB0; --sage: #BFDDB4; --canvas: #F4F7F3;
  --glass: rgba(255,255,255,0.62); --glass-strong: rgba(255,255,255,0.82); --glass-edge: rgba(255,255,255,0.92);
  --solid: #FFFFFF; --line: rgba(29,35,33,0.09); --blur: 14px; --shadow: 0 10px 30px rgba(60,90,80,0.08);
  --tint-gap: linear-gradient(160deg, rgba(255,255,255,0.78), rgba(247,205,176,0.6));
  --tint-unknown: linear-gradient(160deg, rgba(255,255,255,0.78), rgba(210,229,238,0.75));
  --tint-ready: linear-gradient(160deg, rgba(255,255,255,0.78), rgba(191,221,180,0.65));
  --tint-warm: linear-gradient(160deg, rgba(255,255,255,0.78), rgba(247,205,176,0.45));
  --r-xl: 28px; --r-lg: 22px; --r-md: 16px; --r-sm: 12px; --r-pill: 999px;
  --font: "Avenir Next", Avenir, "Century Gothic", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); font-size: 15.5px; line-height: 1.55; background: #DCE3DE; font-variant-numeric: tabular-nums; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: rgba(29,35,33,0.3); text-underline-offset: 3px; }
h1, h2, h3, h4 { font-family: var(--font); font-weight: 500; line-height: 1.15; letter-spacing: -0.015em; margin: 0 0 .5rem; color: var(--ink); }
h1 { font-size: 2.1rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.08rem; }
.phone h1 { font-size: 1.7rem; }
p { margin: 0 0 .75rem; }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
h1:focus, h2:focus { outline: none; }
::selection { background: var(--peach); }
mark { background: rgba(247,205,176,0.85); color: var(--ink); padding: 0 .15rem; border-radius: 3px; }

/* ===== Review bar (outside the app) ===== */
.rb { position: sticky; top: 0; z-index: 100; background: #131716; color: #E8ECEA; padding: 8px 12px 10px; font-size: 13px; line-height: 1.3; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
.rb-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rb-row + .rb-row { margin-top: 6px; }
.rb-title { font-weight: 600; margin-right: 6px; color: #fff; }
.rb-screens { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; flex: 1 1 auto; min-width: 0; }
.rb a, .rb button { font: inherit; font-size: 12.5px; color: #E8ECEA; background: #222826; border: 1px solid #343B38; border-radius: 8px; padding: 6px 10px; text-decoration: none; white-space: nowrap; cursor: pointer; min-height: 32px; display: inline-flex; align-items: center; }
.rb a:hover, .rb button:hover { background: #2D3431; }
.rb a[aria-current="page"] { background: #E8ECEA; color: #131716; border-color: #E8ECEA; }
.rb button[aria-pressed="true"] { background: #E8ECEA; color: #131716; border-color: #E8ECEA; }
.rb .grp { display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; background: #1B201E; }
.rb .grp button { border-color: transparent; }
.rb .note { color: #A7B0AB; margin-left: auto; }
.rb :focus-visible { outline-color: #fff; }

/* ===== Stage: phone frame or full width ===== */
.stage.phone { display: flex; justify-content: center; padding: 22px 10px 40px; }
.device { position: relative; background: var(--canvas); }
.stage.phone .device { width: 390px; max-width: 100%; height: min(844px, calc(100vh - 120px)); min-height: 620px; border: 10px solid #1D2321; border-radius: 54px; overflow: hidden; box-shadow: 0 30px 70px rgba(20,35,28,.28), inset 0 0 0 1px #000; }
.stage.desk .device { min-height: calc(100vh - 84px); }
.statusbar { display: none; }
.stage.phone .statusbar { display: flex; background: rgba(244,247,243,0.88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 40; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; font-size: 14px; font-weight: 600; pointer-events: none; }
.statusbar .notch { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); width: 110px; height: 30px; border-radius: 20px; background: #1D2321; }
.statusbar .sig { display: flex; gap: 4px; align-items: center; }
.statusbar .sig i { display: block; width: 4px; background: var(--ink); border-radius: 1px; }
.scroll { position: relative; }
.stage.phone .scroll { position: static; }
.stage.phone .scroll { height: 100%; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.stage.phone .scroll::-webkit-scrollbar { display: none; }
.app { min-height: 100%; background:
    radial-gradient(120% 60% at 0% 0%, #CFE6EC 0%, transparent 60%),
    radial-gradient(90% 55% at 100% 8%, #DCEFD6 0%, transparent 62%),
    radial-gradient(110% 70% at 70% 100%, #FBE3D2 0%, transparent 65%),
    var(--canvas); }
.phone .topbar.hide-phone { display: none; }
.stage.desk .app { min-height: calc(100vh - 84px); }
.stage.phone .app { padding-top: 44px; min-height: 100%; }
.stage.phone .topbar { top: 44px; }
.stage.desk .topbar { top: var(--rbh, 84px); }

/* ===== Glass ===== */
.glass, .card { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: var(--r-lg); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); box-shadow: var(--shadow); }
.card { padding: 1.2rem 1.3rem; }
.phone .card { padding: 1rem 1.05rem; }
.glass-strong { background: var(--glass-strong); }
.hero-card { position: relative; overflow: hidden; border-radius: var(--r-xl); padding: 1.35rem; }
.phone .hero-card { padding: 1.1rem; }
.hero-card::before { content: ""; position: absolute; inset: -30% -10% auto 35%; height: 160%; pointer-events: none; background: radial-gradient(closest-side, rgba(247,205,176,0.7), transparent), radial-gradient(closest-side at 30% 70%, rgba(191,221,180,0.6), transparent); }
.hero-card > * { position: relative; }
.tint-gap { background: var(--tint-gap); } .tint-unknown { background: var(--tint-unknown); } .tint-ready { background: var(--tint-ready); } .tint-warm { background: var(--tint-warm); }
.solid .glass, .solid .card, .solid .tabbar, .solid .topbar, .solid .pane { background: var(--solid) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
.solid .tint-gap, .solid .skill.tint-gap { background: #FBE6D8 !important; } .solid .tint-unknown { background: #E4EFF4 !important; } .solid .tint-ready { background: #E2EFDC !important; } .solid .tint-warm { background: #FCEFE5 !important; }
.solid .hero-card::before { display: none; }
@media (prefers-reduced-transparency: reduce) { .glass, .card, .tabbar, .topbar, .pane { background: var(--solid) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; } }

/* ===== Layout ===== */
.container { max-width: 1080px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
.container.wide { max-width: 1320px; }
.container.narrow { max-width: 680px; }
.phone .container { padding: .9rem 1rem 7.5rem; }
.stack > * + * { margin-top: 1rem; }
.stack-sm > * + * { margin-top: .5rem; }
.phone .stack > * + * { margin-top: .8rem; }
.row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1rem; }
.phone .grid2, .phone .grid3 { grid-template-columns: minmax(0,1fr); gap: .75rem; }
.muted { color: var(--ink-2); } .small { font-size: .875rem; } .tiny { font-size: .8rem; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.page-head h1 { margin: 0; }
.page-head p { margin: .35rem 0 0; color: var(--ink-2); }
.sec-title { font-size: 1.08rem; margin: 1.6rem 0 .7rem; }
.phone .sec-title { margin-top: 1.3rem; }
.back { display: inline-flex; align-items: center; gap: .2rem; color: var(--ink-2); text-decoration: none; font-weight: 500; min-height: 44px; padding-right: .5rem; margin: -.3rem 0 .2rem -.3rem; border-radius: 12px; background: none; border: 0; }
.back:hover { color: var(--ink); background: none; }

/* ===== Top bar + tab bar ===== */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .65rem 1.5rem; background: rgba(244,247,243,0.72); border-bottom: 1px solid var(--line); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
.phone .topbar { padding: .5rem 1rem; }
.brand { font-weight: 600; font-size: 1.12rem; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: .5rem; min-height: 44px; }
.brand-mark { width: 26px; height: 26px; border-radius: 9px; background: linear-gradient(150deg, var(--peach) 0%, var(--sky) 55%, var(--sage) 100%); border: 1px solid var(--glass-edge); }
.topnav { display: flex; gap: .25rem; }
.topnav a { text-decoration: none; color: var(--ink-2); font-weight: 500; padding: .55rem 1rem; border-radius: var(--r-pill); min-height: 44px; display: inline-flex; align-items: center; }
.topnav a:hover { color: var(--ink); }
.topnav a[aria-current="page"] { background: var(--glass-strong); color: var(--ink); box-shadow: inset 0 0 0 1px var(--glass-edge), 0 2px 8px rgba(40,60,50,.06); }
.phone .topnav { display: none; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 600; color: var(--ink); background: linear-gradient(140deg, var(--peach), var(--sage)); border: 3px solid var(--glass-edge); text-decoration: none; flex: none; }
.avatar.lg { width: 48px; height: 48px; }
.tabbar { display: none; }
.phone .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); position: absolute; z-index: 30; left: 12px; right: 12px; bottom: 14px; padding: 6px; border-radius: 24px; background: var(--glass-strong); border: 1px solid var(--glass-edge); box-shadow: 0 12px 30px rgba(40,60,50,0.16); -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 18px; font-size: .78rem; text-decoration: none; color: var(--ink-2); font-weight: 500; min-height: 52px; }
.tabbar a[aria-current="page"] { background: var(--ink); color: #fff; }
.tabbar a[aria-current="page"] svg { stroke: #fff; }

/* ===== Buttons ===== */
button, .btn { font: inherit; font-weight: 500; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 44px; padding: .6rem 1.05rem; border-radius: var(--r-md); border: 1px solid var(--glass-edge); background: var(--glass-strong); text-decoration: none; transition: background-color .15s ease, transform .1s ease; text-align: center; line-height: 1.25; }
button:hover:not(:disabled), .btn:hover { background: var(--solid); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .5; cursor: not-allowed; }
.primary { background: var(--orange) !important; border-color: var(--orange); color: var(--ink) !important; font-weight: 600; }
.primary:hover:not(:disabled) { background: var(--orange-press) !important; border-color: var(--orange-press); }
.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.dark:hover:not(:disabled) { background: #2C3431; }
.dark svg { stroke: #fff; }
.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.ghost:hover:not(:disabled) { background: rgba(255,255,255,0.55); }
.danger { color: #9B2C2C; }
.block { width: 100%; }
.lg { padding: .95rem 1.2rem; font-size: 1.02rem; min-height: 52px; }
.icon-btn { width: 44px; height: 44px; padding: 0; border-radius: 50%; flex: none; }
.arrow-tile { width: 38px; height: 38px; flex: none; display: inline-grid; place-items: center; border-radius: var(--r-sm); border: 1px solid var(--glass-edge); background: rgba(255,255,255,0.65); }
.segmented { display: flex; gap: 6px; }
.segmented button { flex: 1; background: rgba(255,255,255,0.55); padding-left: .4rem; padding-right: .4rem; }
.segmented button[aria-pressed="true"], .segmented button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

/* ===== Forms ===== */
input[type=text], input[type=email], input[type=password], textarea, select { font: inherit; width: 100%; color: var(--ink); padding: .7rem .85rem; min-height: 44px; border-radius: var(--r-md); border: 1px solid rgba(29,35,33,0.14); background: rgba(255,255,255,0.85); }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(29,35,33,0.12); }
textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
label { display: block; font-size: .86rem; color: var(--ink-2); margin-bottom: .3rem; }
.check { display: flex; gap: .65rem; align-items: flex-start; font-size: .92rem; color: var(--ink); cursor: pointer; min-height: 44px; padding: .4rem 0; margin: 0; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ink); flex: none; }
.ask-bar { display: flex; align-items: center; gap: .6rem; padding: .85rem 1rem; border-radius: 20px; color: var(--ink-2); text-decoration: none; width: 100%; justify-content: flex-start; font-weight: 400; min-height: 52px; }

/* ===== Badges, notices ===== */
.badge { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; font-weight: 600; padding: .22rem .62rem; border-radius: var(--r-pill); background: rgba(255,255,255,0.85); color: var(--ink); white-space: nowrap; border: 1px solid var(--glass-edge); line-height: 1.35; }
.badge.gap { background: var(--orange); border-color: var(--orange); color: var(--ink); }
.badge.warn { background: var(--peach); border-color: var(--peach); }
.badge.ready, .badge.good { background: var(--sage); border-color: var(--sage); }
.badge.info { background: var(--sky); border-color: var(--sky); }
.badge.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.notice { padding: .75rem .95rem; border-radius: var(--r-md); font-size: .92rem; color: var(--ink); background: var(--glass-strong); border: 1px solid var(--glass-edge); }
.notice.warn { background: var(--tint-warm); } .notice.info { background: var(--tint-unknown); } .notice.good { background: var(--tint-ready); }
.notice.bad { background: var(--tint-gap); border-left: 3px solid var(--orange); }

/* ===== Icons ===== */
.icon-well { width: 52px; height: 52px; flex: none; display: inline-grid; place-items: center; border-radius: var(--r-md); background: linear-gradient(150deg, var(--peach) 0%, var(--sky) 55%, var(--sage) 100%); }
.icon-well.sm { width: 40px; height: 40px; border-radius: var(--r-sm); background: rgba(255,255,255,0.72); }
svg.icon { stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ===== Lists, tiles, progress ===== */
.list { list-style: none; padding: 0; margin: 0; }
.list > li { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .8rem 0; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.tile-link { display: flex; flex-direction: column; gap: .35rem; padding: 1rem; border-radius: var(--r-lg); text-decoration: none; color: var(--ink); min-height: 138px; text-align: left; align-items: stretch; justify-content: flex-start; font-weight: 400; width: 100%; }
.tile-link .tile-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: auto; min-height: 40px; }
.tile-link strong { font-weight: 500; font-size: 1.02rem; margin-top: .9rem; display: block; line-height: 1.25; }
.tile-link .sub { color: var(--ink-2); font-size: .84rem; line-height: 1.35; }
.week-dots { display: flex; gap: 6px; }
.week-dots span { display: grid; justify-items: center; gap: 3px; font-size: .68rem; color: var(--ink-2); }
.week-dots i { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--ink-3); display: block; }
.week-dots i.on { background: var(--ink); border-color: var(--ink); }
.week-dots i.today { border-color: var(--orange); border-width: 2.5px; }
.week-dots i.on.today { box-shadow: 0 0 0 2.5px var(--orange); border-color: var(--ink); }
.meter { height: 6px; background: rgba(29,35,33,0.08); border-radius: 99px; overflow: hidden; }
.meter > div { height: 100%; background: var(--ink); border-radius: 99px; transition: width .3s ease; }
.steps4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 120px; }
.steps4 span { height: 6px; border-radius: 4px; background: rgba(29,35,33,0.1); }
.steps4 span.f { background: var(--ink); }
.skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.4), rgba(255,255,255,0.9), rgba(255,255,255,0.4)); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--r-md); }
@keyframes shimmer { to { background-position: -200% 0; } }
.empty { text-align: center; padding: 2rem 1rem; color: var(--ink-2); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.divider { display: flex; align-items: center; gap: .75rem; color: var(--ink-2); font-size: .85rem; margin: .9rem 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ===== Screen components ===== */
/* Today */
.who { display: flex; align-items: center; gap: 12px; }
.who .hi { font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
.who strong { display: block; font-weight: 500; font-size: 1.1rem; line-height: 1.2; }
.who .sub { color: var(--ink-2); font-size: .86rem; }
.who .icon-btn { margin-left: auto; background: var(--glass); }
.hero-top { display: flex; gap: 14px; align-items: center; }
.hero-top h2 { margin: 0; font-size: 1.4rem; }
.hero-top p { margin: 3px 0 0; color: var(--ink-2); font-size: .9rem; line-height: 1.35; }
.times { margin: 16px 0 12px; }
.plan-steps { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 6px; }
.plan-steps li { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 14px; background: rgba(255,255,255,0.6); border: 1px solid var(--glass-edge); font-size: .9rem; line-height: 1.3; }
.plan-steps .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; font-size: .75rem; font-weight: 600; flex: none; }
.plan-steps .t { flex: 1; min-width: 0; }
.plan-steps .t small { display: block; color: var(--ink-2); font-size: .78rem; }
.plan-steps .m { color: var(--ink-2); font-size: .8rem; white-space: nowrap; }
.pair { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.week { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.week strong { font-weight: 500; display: block; white-space: nowrap; }
.phone .week-dots { gap: 4px; }
.phone .week-dots i { width: 16px; height: 16px; }
.phone .week { padding: 12px 14px; }
.win { display: flex; gap: 12px; align-items: center; padding: 14px 16px; text-align: left; width: 100%; font-weight: 400; justify-content: flex-start; border-radius: var(--r-lg); }
.win .grow { flex: 1; min-width: 0; }
.win strong { font-weight: 500; display: block; line-height: 1.3; }
.link-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; width: 100%; text-align: left; font-weight: 500; border-radius: var(--r-lg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border-radius: var(--r-pill); padding: .5rem .95rem; background: rgba(255,255,255,0.7); }
.chips button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; justify-content: flex-start; padding: .8rem 1rem; font-weight: 400; background: rgba(255,255,255,0.7); }
.choice strong { font-weight: 500; display: block; }
.choice[aria-pressed="true"] { background: var(--solid); box-shadow: inset 0 0 0 2px var(--ink); }
.choice .grow { flex: 1; }

/* Desktop Today layout */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
.phone .today-grid { grid-template-columns: minmax(0,1fr); gap: .8rem; }

/* Skill cards (Aura) */
.skill { padding: 18px; border-radius: 24px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--glass-edge); text-align: left; width: 100%; font-weight: 400; align-items: stretch; justify-content: flex-start; box-shadow: var(--shadow); color: var(--ink); }
.phone .skill { padding: 16px; }
.skill .top { display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 10px; }
.skill .name { font-weight: 500; font-size: 1.1rem; line-height: 1.25; }
.skill p { margin: 0; font-size: .92rem; text-wrap: pretty; }
.skill .meta { color: var(--ink-2); font-size: .86rem; text-wrap: pretty; }
.skill .bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 6px; font-weight: 500; font-size: .93rem; gap: 10px; }

function startSession() {

  location.hash = "session";
}
function Session() {
  const s = S.sess;

    const doneN = s.steps.filter((x) => x.status === "done").length;
    return shell('<div class="glass hero-card celebrate" aria-live="polite"><div class="burst" aria-hidden="true">' + ic("sparkle", 40) + '</div><h1 tabindex="-1" style="font-size:1.9rem">Session done</h1><p class="muted">' + doneN + " of " + s.steps.length + " steps in about " + s.minutes + " minutes.</p>" +

  }
  const st = s.steps[s.idx], n = s.steps.length;

  const card = '<section class="glass hero-card step-card" aria-labelledby="st-h"><span class="badge info" style="align-self:flex-start">' + st.kind + " · " + st.min + ' min</span><h2 id="st-h" tabindex="-1">' + st.title + '</h2><p class="muted" style="margin:0">' + st.detail + "</p><p style=\"margin:0\">" + st.body + "</p>" +
    (s.open ? '<p class="notice good" style="margin:0">' + ic("check", 16) + " Opened. When you've finished, mark it done here.</p>" : "") +
    '<div class="step-actions">' + (s.open ? '<button type="button" class="primary lg block" data-act="stepDone">Mark done</button><div class="two"><button type="button" data-act="stepOpen">Open again</button><button type="button" data-act="stepSkip">Skip</button></div>'
      : '<button type="button" class="primary lg block" data-act="stepOpen">Start step ' + ic("arrow", 18) + '</button><div class="two"><button type="button" data-act="stepDone">Mark done</button><button type="button" data-act="stepSkip">Skip</button></div>') + "</div></section>";
  return shell(backLink("today", "Today") + '<div class="progress-head"><span>Step ' + (s.idx + 1) + " of " + n + "</span><span>" + s.minutes + ' min session</span></div><div class="meter" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '" style="margin-bottom:1rem"><div style="width:' + pct + '%"></div></div>' +
    '<div class="stack">' + card + '<div class="glass card"><h3 style="font-size:.95rem">This session</h3>' + list + "</div></div>", { width: "narrow" });
}
function advanceStep(status) {
  const s = S.sess; s.steps[s.idx].status = status; s.open = false;
  const nextIdx = s.steps.findIndex((x, i) => i > s.idx && x.status === "pending");
  if (nextIdx >= 0) { s.idx = nextIdx; S.focus = "#st-h"; render(); return; }
  finishSession();
}
function finishSession() {
  const s = S.sess; s.done = true; const wins = [];
  const done = (k) => s.steps.some((x) => x.key === k && x.status === "done");
  if (done("review")) { S.llLevel = Math.max(S.llLevel, 3); wins.push({ icon: "chart", title: "Little's Law is now strong", sub: "Up from getting there. 4 of 4 right today." }); }
  if (done("story")) { S.firstStory = true; wins.push({ icon: "pen", title: "Your first stakeholder story", sub: "Stakeholder influence now has an answer to judge.", tint: "tint-unknown" }); }
  if (done("mock")) wins.push({ icon: "mic", title: "One more mock answer", sub: "Program risk management is still a gap, but closer.", tint: "tint-warm" });
  if (done("learn")) wins.push({ icon: "book", title: "Working capital: first read done", sub: "Try the quiz tomorrow to lock it in.", tint: "tint-warm" });
  if (!S.weekOn[S.todayIdx]) S.weekOn[S.todayIdx] = true;
  if (weekCount() >= S.target) wins.push({ icon: "target", title: "Weekly target met", sub: weekCount() + " of " + S.target + " sessions this week." });
  if (!wins.length) wins.push({ icon: "check", title: "You showed up", sub: "That counts toward your week." });
  s.wins = wins; S.focus = "h1"; render();
}

/* ================= 6. Quiz ================= */
function gradeText(q, text) {
  const t = " " + text.toLowerCase().replace(/\s+/g, " ") + " ";
  const res = q.rubric.map((r) => {
    const full = r.full.some((k) => t.indexOf(k) >= 0), part = !full && r.part.some((k) => t.indexOf(k) >= 0);
    return { label: r.label, mark: full ? "y" : part ? "p" : "n" };
  });
  const score = res.reduce((a, r) => a + (r.mark === "y" ? 1 : r.mark === "p" ? 0.5 : 0), 0);
  return { crit: res, score: score, max: q.rubric.length, verdict: score >= q.rubric.length - 0.5 ? "Strong answer" : score >= q.rubric.length / 2 ? "Partly there" : "Needs work" };
}
function Quiz() {
  const z = S.quiz, n = QUESTIONS.length;

  const head = (z.fromSession ? "" : backLink("library", "Library")) + '<div class="page-head"><div><h1 tabindex="-1" style="font-size:1.7rem">Little\'s Law and variability</h1><p>From Factory Physics, chapters 7 and 8 · ' + n + " questions</p></div></div>";
  if (z.finished) {
    let score = 0, max = 0;
    const rows = QUESTIONS.map((q, i) => { const r = z.res[i]; let lab = "Skipped", cls = ""; if (r) { if (q.type === "mcq") { max += 1; score += r.ok ? 1 : 0; lab = r.ok ? "Right" : "Not quite"; cls = r.ok ? "ready" : "warn"; } else { max += 1; score += r.score / r.max; lab = r.verdict; cls = r.verdict === "Strong answer" ? "ready" : r.verdict === "Partly there" ? "warn" : "gap"; } } else max += 1;
      return '<li><span style="flex:1;min-width:0"><span class="small muted">' + (i + 1) + ". " + q.tag + '</span><br>' + esc(q.q.length > 80 ? q.q.slice(0, 78) + "…" : q.q) + '</span><span class="badge ' + cls + '">' + lab + "</span></li>"; }).join("");
    const pts = Math.round(score * 10) / 10;
    return shell(banner + head + '<section class="glass hero-card stack" aria-live="polite"><div class="row" style="align-items:flex-end"><span class="score">' + pts + '</span><span class="muted" style="padding-bottom:.3rem">out of ' + n + "</span></div>" +

      (z.fromSession ? '<button type="button" class="primary lg block" data-act="quizBackSession">Back to session</button>' : '<div class="row"><a class="btn primary lg" href="#today">Back to Today</a><button type="button" data-act="quizRestart">Try again</button></div>') + "</section>" + '<div style="margin-top:1rem">' + dots + "</div>", { width: "narrow" });
  }
  const q = QUESTIONS[z.idx], r = z.res[z.idx], a = z.ans[z.idx];
  let inner = '<span class="badge info">' + q.tag + '</span><h2 id="q-h" tabindex="-1" style="margin:.7rem 0 1rem">' + esc(q.q) + "</h2>";

    if (r) inner += '<div class="feedback" tabindex="-1" id="fb" aria-live="polite"><div class="row spread"><strong style="font-weight:500">' + r.verdict + '</strong><span class="small muted">' + r.score + " of " + r.max + ' points</span></div><p class="small muted" style="margin:.4rem 0 0">What a good answer covers:</p><ul class="criteria">' +

  }

    : '<div class="row"><button type="button" class="primary lg" style="flex:1" data-act="qCheck"' + ((q.type === "mcq" ? a == null : !(a && a.trim())) ? " disabled" : "") + '>Check answer</button><button type="button" class="ghost" data-act="qSkip">Skip</button></div>';
  return shell(banner + head + '<div class="progress-head"><span>Question ' + (z.idx + 1) + " of " + n + "</span><span>" + Object.keys(z.res).length + ' answered</span></div><section class="glass q-card" aria-labelledby="q-h">' + inner + '<div style="margin-top:1rem">' + actions + "</div></section>" + '<div style="margin-top:.8rem">' + dots + "</div>", { width: "narrow" });

function evalAnswer(t, follow) {

}

/* ================= Router ================= */
const ROUTES = { welcome: Welcome, signup: Signup, onboarding: Onboarding, today: Today, session: Session, quiz: Quiz, prep: Prep, roleprep: RolePrep, interview: Interview, library: Library, document: Doc, progress: Progress, profile: Profile };
const LABELS = [["welcome", "1 Welcome"], ["signup", "2 Sign up"], ["onboarding", "3 Onboarding"], ["today", "4 Today"], ["session", "5 Session"], ["quiz", "6 Quiz"], ["prep", "7 Prep"], ["roleprep", "8 Role prep"], ["interview", "9 Mock interview"], ["library", "10 Library"], ["document", "11 Document"], ["progress", "12 What you know"], ["profile", "13 Profile"]];
const DEFAULT_ROUTE = "today";
function render() {
  const fn = ROUTES[S.route] || ROUTES[DEFAULT_ROUTE];
  $("#app").innerHTML = fn();
  $("#rb-screens").innerHTML = LABELS.map(([k, l]) => '<a href="#' + k + '"' + (S.route === k ? ' aria-current="page"' : "") + ">" + l + "</a>").join("");
  const rbEl = $(".rb"); if (rbEl && rbEl.offsetHeight) document.documentElement.style.setProperty("--rbh", rbEl.offsetHeight + "px");
  const stage = $("#stage"); stage.className = "stage " + (S.phone ? "phone" : "desk");
  document.body.classList.toggle("solid", S.solid);
  $("#rb-phone").setAttribute("aria-pressed", S.phone); $("#rb-desk").setAttribute("aria-pressed", !S.phone);
  $("#rb-solid").setAttribute("aria-pressed", S.solid); $("#rb-debrief").setAttribute("aria-pressed", S.showDebrief);
  if (S.doc.hl) $$(".page-text mark").forEach((m) => m.classList.toggle("hl", m.dataset.q === S.doc.hl));
  if (S.focus) { const el = $(S.focus, $("#app")); S.focus = null; if (el) { if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: false }); } }
}
function route() {
  const h = location.hash.slice(1);
  const prev = S.route;
  S.route = ROUTES[h] ? h : DEFAULT_ROUTE;
  if (S.route === "session" && !S.sess) { startSessionSilently(); }
  if (prev !== S.route) { S.focus = "h1"; $("#scroll").scrollTop = 0; window.scrollTo(0, 0); }
  render();
}
function startSessionSilently() { const keys = PLANS[S.minutes]; S.sess = { minutes: S.minutes, steps: keys.map((k) => Object.assign({ key: k, status: "pending" }, STEPS[k])), idx: 0, open: false, done: false, wins: [] }; }

/* ================= Events ================= */
function setModel(path, val) { const parts = path.split("."); let o = S; for (let i = 0; i < parts.length - 1; i++) { if (o[parts[i]] == null) o[parts[i]] = {}; o = o[parts[i]]; } o[parts[parts.length - 1]] = val; }
const ACTIONS = {
  minutes: (a) => { S.minutes = +a; render(); },
  startSession: () => { startSession(); },
  bell: () => toast("Reminders: today at 7:30 pm. Change it in Profile."),
  askBar: () => { S.doc.tab = "ask"; S.doc.ttab = "ask"; },
  debOut: (a) => { S.deb.outcome = a; S.deb.next = null; render(); },
  debNext: (a) => { S.deb.next = a; render(); },
  debSave: () => { S.deb.done = true; S.focus = "#deb"; render(); },
  debReset: () => { S.deb = { outcome: null, next: null, done: false }; S.showDebrief = false; render(); },
  stepOpen: () => { const s = S.sess, st = s.steps[s.idx]; s.open = true;
    if (st.go === "quiz") { S.quiz = { idx: 0, ans: {}, res: {}, fromSession: true, finished: false }; location.hash = "quiz"; }
    else if (st.go === "interview") { S.iv = { phase: "q", a1: "", a2: "", r1: null, r2: null, fromSession: true }; location.hash = "interview"; }
    else { render(); toast(st.go === "story" ? "Story editor opened (in the real app)" : "Reading opened (in the real app)"); } },
  stepDone: () => advanceStep("done"),
  stepSkip: () => advanceStep("skipped"),
  backToday: () => { S.sess = null; location.hash = "today"; },
  quizBackSession: () => { if (S.sess) { const s = S.sess; if (s.steps[s.idx].go === "quiz") { location.hash = "session"; setTimeout(() => advanceStep("done"), 0); return; } } location.hash = "session"; },
  ivBackSession: () => { if (S.sess && S.sess.steps[S.sess.idx].go === "interview") { setTimeout(() => advanceStep("done"), 0); } },
  qPick: (a) => { S.quiz.ans[S.quiz.idx] = +a; render(); },
  qCheck: () => { const z = S.quiz, q = QUESTIONS[z.idx];
    if (q.type === "mcq") z.res[z.idx] = { ok: z.ans[z.idx] === q.correct }; else z.res[z.idx] = gradeText(q, z.ans[z.idx] || "");
    S.focus = "#fb"; render(); },
  qSample: () => { S.quiz.ans[S.quiz.idx] = QUESTIONS[S.quiz.idx].sample; render(); const t = $("#q-text"); if (t) t.focus(); },
  qNext: () => { const z = S.quiz; if (z.idx < QUESTIONS.length - 1) { z.idx++; S.focus = "#q-h"; } else { z.finished = true; S.llLevel = Math.max(S.llLevel, Object.keys(z.res).length >= 3 ? 3 : S.llLevel); S.focus = "h1"; } render(); },
  qSkip: () => ACTIONS.qNext(),
  qGo: (a) => { S.quiz.idx = +a; S.quiz.finished = false; S.focus = "#q-h"; render(); },
  quizRestart: () => { S.quiz = { idx: 0, ans: {}, res: {}, fromSession: false, finished: false }; S.focus = "#q-h"; render(); },
  quizFresh: () => { S.quiz = { idx: 0, ans: {}, res: {}, fromSession: false, finished: false }; },
  skillToggle: (a) => { S.prep.open = S.prep.open === a ? null : a; render(); const b = $('[data-act="skillToggle"][data-arg="' + a + '"]'); if (b) b.focus(); },
  override: (a) => { const [id, v] = a.split("|"); S.prep.override[id] = v; render(); },
  toastRebuild: () => toast("Plan rebuilt with your changes. 5 items this week."),
  toastNew: () => toast("In the app this opens the gap report for a new job."),
  ivFresh: () => { S.iv = { phase: "q", a1: "", a2: "", r1: null, r2: null, fromSession: false }; if (S.route === "interview") { S.focus = "#iv-q"; render(); } },
  ivSample: () => { S.iv.a1 = IV_SAMPLE; render(); $("#iv-a1").focus(); },
  ivSample2: () => { S.iv.a2 = IV_SAMPLE2; render(); $("#iv-a2").focus(); },
  ivSubmit: () => { S.iv.r1 = evalAnswer(S.iv.a1, false); S.mockCount = 2; S.focus = "#iv-ev"; render(); },
  ivSubmit2: () => { S.iv.r2 = evalAnswer(S.iv.a2, true); S.focus = "#iv-ev2"; render(); },
  ivSummary: () => { S.iv.phase = "summary"; S.focus = "#iv-sum"; render(); },
  rights: () => { S.lib.rightsAck = true; render(); toast("Thanks. We'll remember that."); },
  upload: () => { const L = S.lib; if (L.docs.some((d) => d.id === "ops")) { toast("Already reading that one."); return; }
    L.docs.unshift({ id: "ops", title: "Operations Strategy notes", sub: "PDF · 64 pages", status: "processing" }); L.up = { ready: false }; render();
    timers.push(setTimeout(() => { L.up.ready = true; if (S.route === "library") render(); }, 1500));
    timers.push(setTimeout(() => { const d = L.docs.find((x) => x.id === "ops"); if (d) d.status = "ready"; L.up = null; if (S.route === "library") render(); toast("Operations Strategy notes is ready"); }, 6000)); },
  retryDoc: () => toast("Remove the password from the PDF, then choose it again."),
  docTab: (a) => { S.doc.tab = a; render(); },
  docTTab: (a) => { S.doc.ttab = a; render(); },
  starter: (a) => askTutor(STARTERS[+a].q),
  askText: (a) => askTutor(a),
  general: (a) => { S.doc.msgs[+a].general = true; render(); },
  cite: (a) => showCite(a),
  tgt: (a) => { S.target = Math.min(7, Math.max(1, S.target + +a)); render(); },
  remind: () => { S.reminders = !S.reminders; render(); },
  weekly: () => { S.weeklyEmail = !S.weeklyEmail; render(); },
  solid: () => { S.solid = !S.solid; render(); },
  download: () => toast("We're preparing your zip. We'll email you a link within an hour."),
  signout: () => { location.hash = "welcome"; S.w.phase = "form"; S.fromWelcome = false; },
  delOpen: () => { S.del = { open: true, text: "" }; S.focus = "#del-in"; render(); },
  delCancel: () => { S.del = { open: false }; render(); },
  delGo: () => { S.del = { open: false }; toast("Account deleted (not really, this is a preview)."); location.hash = "welcome"; },
  saveReport: () => { S.fromWelcome = true; S.authMode = "signup"; location.hash = "signup"; },
  editReport: () => { S.w.phase = "form"; S.focus = "#w-job"; render(); },
  goSignin: () => { S.fromWelcome = false; S.authMode = "signin"; location.hash = "signup"; },
  authToggle: () => { S.authMode = S.authMode === "signup" ? "signin" : "signup"; S.focus = "h1"; render(); },
  authDone: () => { if (S.authMode === "signin") location.hash = "today"; else { S.ob.step = 1; location.hash = "onboarding"; } },
  obPick: (a) => { S.ob.prepFor = a; render(); },
  obTarget: (a) => { S.ob.target = +a; render(); },
  obNext: (a) => { S.ob.next = a; render(); },
  obBack: () => { S.ob.step--; S.focus = "h1"; render(); },
  obContinue: () => { if (S.ob.step < 3) { S.ob.step++; S.focus = "h1"; render(); return; }
    S.target = S.ob.target; if (S.ob.next === "session") startSession(); else if (S.ob.next === "upload") location.hash = "library"; else location.hash = "today"; }
};
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t || !$("#app").contains(t)) return;
  const fn = ACTIONS[t.dataset.act]; if (!fn) return;
  if (t.tagName === "BUTTON" || t.type === "checkbox") { if (t.tagName === "BUTTON") e.preventDefault(); }
  fn(t.dataset.arg);
});
document.addEventListener("input", (e) => {
  const t = e.target; if (!t.dataset || !t.dataset.model) return;
  setModel(t.dataset.model, t.value);
  // Enable / disable dependent buttons without a re-render (keeps the caret).
  const enable = (sel, ok) => { const b = $(sel); if (b) b.disabled = !ok; };
  if (t.id === "q-text") enable('[data-act="qCheck"]', t.value.trim().length > 0);
  if (t.id === "iv-a1") enable('[data-act="ivSubmit"]', t.value.trim().length > 0);
  if (t.id === "iv-a2") enable('[data-act="ivSubmit2"]', t.value.trim().length > 0);
  if (t.id === "del-in") enable("#del-go", t.value.trim().toLowerCase() === "delete my account");
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "report") {
    if (S.w.job.trim().length < 50 || S.w.resume.trim().length < 50) { toast("Paste a bit more of the job and your resume (at least a few lines each)."); return; }
    S.w.phase = "loading"; render();
    timers.push(setTimeout(() => { S.w.phase = "report"; S.focus = "#rep-h"; if (S.route === "welcome") render(); }, 1200));
  } else if (f === "auth") ACTIONS.authDone();
  else if (f === "ask") askTutor(S.doc.draft);
});
$("#rb-phone").addEventListener("click", () => { S.phone = true; render(); });
$("#rb-desk").addEventListener("click", () => { S.phone = false; render(); });
$("#rb-solid").addEventListener("click", () => { S.solid = !S.solid; render(); });
$("#rb-debrief").addEventListener("click", () => { S.showDebrief = !S.showDebrief; S.deb = { outcome: null, next: null, done: false }; if (S.route !== "today") location.hash = "today"; else render(); });
$("#rb-reset").addEventListener("click", () => { timers.forEach(clearTimeout); timers = []; const keep = { phone: S.phone, solid: S.solid }; S = initState(); Object.assign(S, keep); S.route = ""; route(); toast("Sample data reset"); });
window.addEventListener("hashchange", route);
route();
</script>
</body></html>
