name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      AI_PROVIDER: mock
      MINDMESH_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements-dev.lock --progress-spinner off
      - name: Tests (in-memory limits, plus Redis unit tests)
        run: pytest -q
      - name: API tests with shared state in Redis
        run: pytest -q tests/test_api.py tests/test_api_engagement.py tests/test_api_goals.py tests/test_api_interview.py
        env:
          REDIS_URL: redis://localhost:6379/14
      - name: Eval (mock) against baseline
        run: python -m evals.run --baseline evals/baseline.json --fail-under-citation 0.95 --out eval-report.json
      - name: Prompt-injection eval (deterministic layer)
        # Planted instructions can't produce fake citations. injection_resistance is printed for
        # information: the mock tutor quotes sources, so the 1.0 gate runs with the real model.
        run: python -m evals.run --gold evals/gold/adversarial.jsonl --docs docs/adversarial.txt --fail-under-citation 1.0
      - name: Notes-first answers gate
        # Off-topic questions never answered from notes; planted instructions never quoted; local answers cite the right pages.
        run: python -m evals.notes_eval --gate
      - name: Knowledge-graph and mastery gates
        # Merge rules never merge different concepts; knowledge tracing beats the old rules;
        # extraction quotes check out. Edge precision is gated only with the real model.
        run: python -m evals.graph_eval --gate
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: backend/eval-report.json
          if-no-files-found: ignore

  postgres:
    # Migrations + row-level security on the same image docker compose uses.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mindmesh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      AI_PROVIDER: mock
      DATABASE_URL: postgresql+psycopg://mindmesh_app:mindmesh_app@localhost:5432/mindmesh
      MINDMESH_PG_URL: postgresql+psycopg://mindmesh_app:mindmesh_app@localhost:5432/mindmesh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Create app role (as superuser, like docker-entrypoint-initdb.d)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d mindmesh -v ON_ERROR_STOP=1 -f sql/init/01-app-role.sql
      - name: Migrate
        run: alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Apply row-level security
        run: PGPASSWORD=mindmesh_app psql -h localhost -U mindmesh_app -d mindmesh -v ON_ERROR_STOP=1 -f sql/rls.sql
      - name: pgvector for dense embeddings (as superuser, like the migrate/admin role)
        run: python -m app.tools.pgvector_setup --dim 128
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mindmesh
      - name: RLS tests
        run: pytest -q tests/test_postgres_rls.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  mobile:
    # Expo app (SDK 57): types and unit tests. Native builds need EAS or Xcode, not run here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx jest --ci
      - name: Web build
        run: npx expo export --platform web --output-dir dist

  e2e:
    # Playwright smoke tests: real browser, real API (mock AI, throwaway SQLite), production web build.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: pip install --require-hashes -r ../backend/requirements.lock
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
